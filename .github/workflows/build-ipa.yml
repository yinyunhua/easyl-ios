name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Environment probe
        id: env
        run: |
          set -x
          sw_vers || true
          uname -m || true
          xcode-select -p || true
          xcodebuild -version || true
          swift --version || true
          df -h / || true
          echo "PATH=$PATH"

      - name: Install XcodeGen (official release, no Homebrew)
        id: xcodegen
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q -o xcodegen.zip -d xcodegen-dist
          sudo bash xcodegen-dist/xcodegen/install.sh
          export PATH="/usr/local/bin:$PATH"
          xcodegen --version
          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "release install failed, falling back to brew"
            brew install xcodegen
          fi

      - name: Generate Xcode project
        id: project
        run: |
          set -o pipefail
          export PATH="/usr/local/bin:$PATH"
          xcodegen generate 2>&1 | tee xcodegen.log
          xcodebuild -list -project EasylForIOS.xcodeproj

      - name: Build app (unsigned)
        id: build
        run: |
          set -o pipefail
          xcodebuild \
            -project EasylForIOS.xcodeproj \
            -scheme EasylForIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Diagnose failures
        if: failure()
        run: |
          echo "=== step outcomes ==="
          echo "env=${{ steps.env.outcome }} xcodegen=${{ steps.xcodegen.outcome }} project=${{ steps.project.outcome }} build=${{ steps.build.outcome }}"
          echo "=== files ==="
          ls -la || true
          for f in xcodegen.log xcodebuild.log; do
            if [ -f "$f" ]; then
              echo "=== tail -40 of $f ==="
              tail -40 "$f" || true
              echo "::error::----- $f (last lines) -----"
              tail -6 "$f" | while IFS= read -r line; do echo "::error::$line"; done
            else
              echo "::error::$f 不存在 -> 失败发生在生成/编译之前，请查看上一步的完整输出"
            fi
          done
          echo "=== build products ==="
          ls -la build/Build/Products/ 2>/dev/null || echo "(no products dir)"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            xcodebuild.log
            xcodegen.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Package IPA
        run: |
          ls -la build/Build/Products/Release-iphoneos/
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/EasylForIOS.app Payload/EasylForIOS.app
          zip -qry EasylForIOS-unsigned.ipa Payload
          ls -lh EasylForIOS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EasylForIOS-unsigned-ipa
          path: EasylForIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
