name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  CI_TRACE: ${{ github.workspace }}/ci-trace.txt
  XCODEGEN_VERSION: "2.42.0"

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Environment probe
        id: env
        run: |
          set -x
          sw_vers || true
          uname -m || true
          xcode-select -p || true
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Install XcodeGen (pinned 2.42.0, Xcode 15 compatible)
        id: xcodegen
        run: |
          set -Euxo pipefail
          trap 'echo "[install-xcodegen] FAILED at: $BASH_COMMAND" >> "$CI_TRACE"' ERR
          cd "$RUNNER_TEMP"
          curl -fsSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q -o xcodegen.zip -d xcodegen-dist
          sudo bash xcodegen-dist/xcodegen/install.sh
          /usr/local/bin/xcodegen --version
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Generate and validate project
        id: project
        run: |
          set +e
          xcodegen generate > xcodegen.log 2>&1
          code=$?
          cat xcodegen.log
          echo "xcodegen exit code: $code"

          if [ ! -d EasylForIOS.xcodeproj ]; then
            echo "::error::xcodegen produced no project (exit $code)"
            exit 1
          fi

          PBX=EasylForIOS.xcodeproj/project.pbxproj
          echo "pbxproj size: $(wc -c < "$PBX") bytes"
          objver=$(grep -m1 -o 'objectVersion = [0-9]*;' "$PBX" | grep -o '[0-9]*')
          echo "objectVersion = ${objver:-unknown}"
          plutil -lint "$PBX" || true

          if [ -n "$objver" ] && [ "$objver" -gt 60 ]; then
            echo "::error::objectVersion $objver is too new for the Xcode on this runner"
            exit 1
          fi

          # 硬校验：Xcode 必须读得懂这个工程（之前这条被我加了 || true，掩盖了真实错误）
          if ! xcodebuild -list -project EasylForIOS.xcodeproj > list.log 2>&1; then
            echo "::error::xcodebuild cannot read the generated project"
            echo "----- list.log -----"; cat list.log
            echo "----- project.pbxproj head -----"; head -40 "$PBX"
            exit 1
          fi
          cat list.log

      - name: Build app (unsigned)
        id: build
        run: |
          set +e
          xcodebuild \
            -project EasylForIOS.xcodeproj \
            -scheme EasylForIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          code=$?
          echo "$code" > build-exit.txt
          echo "xcodebuild exit code: $code"
          tail -80 xcodebuild.log
          exit "$code"

      - name: Diagnose failures
        if: failure()
        run: |
          echo "::error::failure attribution: env=${{ steps.env.outcome }} xcodegen=${{ steps.xcodegen.outcome }} project=${{ steps.project.outcome }} build=${{ steps.build.outcome }}"
          [ -f "$CI_TRACE" ] && cat "$CI_TRACE" && while IFS= read -r l; do echo "::error::$l"; done < "$CI_TRACE"
          [ -f build-exit.txt ] && echo "::error::xcodebuild exit code: $(cat build-exit.txt)"
          for f in xcodegen.log xcodebuild.log list.log; do
            if [ -f "$f" ]; then
              echo "=== $f (tail -25) ==="; tail -25 "$f"
            else
              echo "::error::$f not created"
            fi
          done
          if [ -f xcodebuild.log ]; then
            count=$(grep -c "error:" xcodebuild.log || true)
            echo "::error::xcodebuild error lines: ${count:-0}"
            if [ "${count:-0}" != "0" ]; then
              grep "error:" xcodebuild.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            fi
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            xcodebuild.log
            xcodegen.log
            list.log
            ci-trace.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Package IPA
        run: |
          ls -la build/Build/Products/Release-iphoneos/
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/EasylForIOS.app Payload/EasylForIOS.app
          zip -qry EasylForIOS-unsigned.ipa Payload
          ls -lh EasylForIOS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EasylForIOS-unsigned-ipa
          path: EasylForIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
