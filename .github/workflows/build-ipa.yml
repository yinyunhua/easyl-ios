name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          df -h / | tail -1

      - name: Install XcodeGen
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install xcodegen || (echo "first attempt failed, retrying in 15s" && sleep 15 && brew install xcodegen)
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate 2>&1 | tee xcodegen.log
          xcodebuild -list -project EasylForIOS.xcodeproj

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project EasylForIOS.xcodeproj \
            -scheme EasylForIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Diagnose build errors
        if: failure()
        run: |
          echo "===== error: lines (max 60) ====="
          grep -n "error:" xcodebuild.log | head -60 || echo "(no 'error:' line in log)"
          echo ""
          echo "===== last 80 lines of log ====="
          tail -80 xcodebuild.log || true
          echo ""
          echo "::error::build failed, key error lines below"
          grep "error:" xcodebuild.log | head -5 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            xcodebuild.log
            xcodegen.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Package IPA
        run: |
          ls -la build/Build/Products/Release-iphoneos/
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/EasylForIOS.app Payload/EasylForIOS.app
          zip -qry EasylForIOS-unsigned.ipa Payload
          ls -lh EasylForIOS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EasylForIOS-unsigned-ipa
          path: EasylForIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
