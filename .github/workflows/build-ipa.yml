name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  CI_TRACE: ${{ github.workspace }}/ci-trace.txt

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Environment probe
        id: env
        run: |
          set -x
          sw_vers || true
          uname -m || true
          xcode-select -p || true
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
          df -h / || true

      - name: Install XcodeGen (official release)
        id: xcodegen
        run: |
          set -Euxo pipefail
          trap 'echo "[install-xcodegen] FAILED at: $BASH_COMMAND" >> "$CI_TRACE"' ERR
          cd "$RUNNER_TEMP"
          curl -fsSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q -o xcodegen.zip -d xcodegen-dist
          sudo bash xcodegen-dist/xcodegen/install.sh
          /usr/local/bin/xcodegen --version
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        id: project
        run: |
          set +e
          xcodegen generate > xcodegen.log 2>&1
          code=$?
          cat xcodegen.log
          echo "xcodegen exit code: $code"
          if [ -d EasylForIOS.xcodeproj ]; then
            echo "project directory exists -> continue regardless of exit code"
            exit 0
          fi
          echo "::error::xcodegen failed and produced no project (exit $code)"
          exit "$code"

      - name: Inspect project (non-fatal)
        id: inspect
        run: |
          ls -la EasylForIOS.xcodeproj || true
          xcodebuild -list -project EasylForIOS.xcodeproj || true
          xcodebuild -showBuildSettings -project EasylForIOS.xcodeproj -target EasylForIOS 2>&1 | head -30 || true

      - name: Build app (unsigned)
        id: build
        run: |
          set +e
          xcodebuild \
            -project EasylForIOS.xcodeproj \
            -scheme EasylForIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          code=$?
          echo "xcodebuild exit code: $code"
          tail -80 xcodebuild.log
          exit "$code"

      - name: Diagnose failures
        if: failure()
        run: |
          echo "=== step outcomes ==="
          echo "env=${{ steps.env.outcome }} xcodegen=${{ steps.xcodegen.outcome }} project=${{ steps.project.outcome }} inspect=${{ steps.inspect.outcome }} build=${{ steps.build.outcome }}"
          echo "::error::failure attribution: env=${{ steps.env.outcome }} xcodegen=${{ steps.xcodegen.outcome }} project=${{ steps.project.outcome }} inspect=${{ steps.inspect.outcome }} build=${{ steps.build.outcome }}"
          if [ -f "$CI_TRACE" ]; then
            echo "=== ci-trace ==="
            cat "$CI_TRACE"
            while IFS= read -r line; do echo "::error::$line"; done < "$CI_TRACE"
          fi
          for f in xcodegen.log xcodebuild.log; do
            if [ -f "$f" ]; then
              echo "=== $f : error lines ==="
              grep -n "error:" "$f" | head -40 || echo "(no error: lines)"
              echo "=== $f : tail -25 ==="
              tail -25 "$f"
            else
              echo "::error::$f missing (failure happened before this log was created)"
            fi
          done
          ls -la build/Build/Products/ 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            xcodebuild.log
            xcodegen.log
            ci-trace.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Package IPA
        run: |
          ls -la build/Build/Products/Release-iphoneos/
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/EasylForIOS.app Payload/EasylForIOS.app
          zip -qry EasylForIOS-unsigned.ipa Payload
          ls -lh EasylForIOS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EasylForIOS-unsigned-ipa
          path: EasylForIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
